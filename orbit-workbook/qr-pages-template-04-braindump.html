<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabbi Entry: Brain Dump</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            padding: 30px;
            border-top: 4px solid #9c27b0;
        }
        
        .header {
            margin-bottom: 30px;
            border-bottom: 2px solid #e0ddd4;
            padding-bottom: 20px;
        }
        
        .header h1 {
            font-size: 20px;
            color: #2c2c2a;
            margin-bottom: 6px;
        }
        
        .header p {
            font-size: 13px;
            color: #888780;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #2c2c2a;
            margin-bottom: 8px;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d3d1c7;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            min-height: 150px;
        }
        
        textarea:focus {
            outline: none;
            border-color: #9c27b0;
            box-shadow: 0 0 0 3px rgba(156, 39, 176, 0.1);
        }
        
        .info {
            background: #f3e5f5;
            border: 1px solid #e1bee7;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #5e35b1;
            line-height: 1.5;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .btn-save {
            background: #9c27b0;
            color: white;
        }
        
        .btn-save:hover {
            background: #7b1fa2;
        }
        
        .btn-another {
            background: #e0ddd4;
            color: #2c2c2a;
        }
        
        .btn-another:hover {
            background: #d3d1c7;
        }
        
        .success {
            display: none;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #4caf50;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success" id="success">
            ✓ Brain dump saved to Tabbi!
        </div>
        
        <div class="header">
            <h1>🧠 Brain Dump</h1>
            <p>Capture everything. Sort later.</p>
        </div>
        
        <div class="info">
            No structure required. Just dump what's on your mind. You can sort, organize, and move things around later. Everything goes into your inbox.
        </div>
        
        <form id="dumpForm">
            <div class="form-group">
                <label for="content">Everything on your mind</label>
                <textarea id="content" name="content" placeholder="Write everything. Don't worry about structure or organization. Just dump it all here and you'll sort it later." required></textarea>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-save">Save & Close</button>
                <button type="button" class="btn-another" id="addAnother">Save & Dump More</button>
            </div>
        </form>
    </div>
    
    <script>
        const form = document.getElementById('dumpForm');
        const successMsg = document.getElementById('success');
        const addAnotherBtn = document.getElementById('addAnother');
        
        function saveEntry(andClose = true) {
            const formData = {
                timestamp: new Date().toISOString(),
                spread: 'spread-braindump',
                content: document.getElementById('content').value,
                type: 'braindump'
            };
            
            let entries = JSON.parse(localStorage.getItem('tabbiEntries')) || [];
            entries.push(formData);
            localStorage.setItem('tabbiEntries', JSON.stringify(entries));
            
            successMsg.style.display = 'block';
            
            if (andClose) {
                setTimeout(() => window.close(), 1200);
            } else {
                form.reset();
                document.getElementById('content').focus();
                setTimeout(() => { successMsg.style.display = 'none'; }, 1500);
            }
        }
        
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            saveEntry(true);
        });
        
        addAnotherBtn.addEventListener('click', () => {
            saveEntry(false);
        });
    </script>
</body>
</html>
