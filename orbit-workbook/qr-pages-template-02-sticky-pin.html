<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabbi Entry: Quick Pin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #fff8e1 0%, #ffe082 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            padding: 30px;
            border-top: 4px solid #fbc02d;
        }
        
        .header {
            margin-bottom: 30px;
            border-bottom: 2px solid #e0ddd4;
            padding-bottom: 20px;
        }
        
        .header h1 {
            font-size: 20px;
            color: #2c2c2a;
            margin-bottom: 6px;
        }
        
        .header p {
            font-size: 13px;
            color: #888780;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #2c2c2a;
            margin-bottom: 8px;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d3d1c7;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #fbc02d;
            box-shadow: 0 0 0 3px rgba(251, 192, 45, 0.1);
        }
        
        input[type="date"] {
            cursor: pointer;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .btn-save {
            background: #fbc02d;
            color: #333;
        }
        
        .btn-save:hover {
            background: #f9a825;
        }
        
        .btn-another {
            background: #e0ddd4;
            color: #2c2c2a;
        }
        
        .btn-another:hover {
            background: #d3d1c7;
        }
        
        .success {
            display: none;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #4caf50;
        }
        
        .hint {
            font-size: 12px;
            color: #888780;
            font-style: italic;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success" id="success">
            ✓ Pinned to Tabbi!
        </div>
        
        <div class="header">
            <h1>📌 Quick Pin</h1>
            <p>One-liner capture from sticky notes</p>
        </div>
        
        <form id="pinForm">
            <div class="form-group">
                <label for="title">What's this pin?</label>
                <input type="text" id="title" name="title" placeholder="One line, quick..." required maxlength="100">
                <div class="hint">Keep it short. You can add details later.</div>
            </div>
            
            <div class="form-group">
                <label for="tab">Which tab?</label>
                <select id="tab" name="tab" required>
                    <option value="">Choose...</option>
                    <option value="work">Work</option>
                    <option value="finance">Finance</option>
                    <option value="home">Home</option>
                    <option value="health">Health</option>
                    <option value="goals">Goals</option>
                    <option value="custom">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="dueDate">Due date? (optional)</label>
                <input type="date" id="dueDate" name="dueDate">
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-save">Save & Close</button>
                <button type="button" class="btn-another" id="addAnother">Save & Add Another</button>
            </div>
        </form>
    </div>
    
    <script>
        const form = document.getElementById('pinForm');
        const successMsg = document.getElementById('success');
        const addAnotherBtn = document.getElementById('addAnother');
        
        function saveEntry(andClose = true) {
            const formData = {
                timestamp: new Date().toISOString(),
                spread: 'spread-sticky-pin',
                title: document.getElementById('title').value,
                tab: document.getElementById('tab').value,
                dueDate: document.getElementById('dueDate').value || null
            };
            
            let entries = JSON.parse(localStorage.getItem('tabbiEntries')) || [];
            entries.push(formData);
            localStorage.setItem('tabbiEntries', JSON.stringify(entries));
            
            successMsg.style.display = 'block';
            
            if (andClose) {
                setTimeout(() => window.close(), 1200);
            } else {
                form.reset();
                document.getElementById('title').focus();
                setTimeout(() => { successMsg.style.display = 'none'; }, 1500);
            }
        }
        
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            saveEntry(true);
        });
        
        addAnotherBtn.addEventListener('click', () => {
            saveEntry(false);
        });
    </script>
</body>
</html>
