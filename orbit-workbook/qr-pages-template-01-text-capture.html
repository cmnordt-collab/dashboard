<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabbi Entry: Quick Capture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f5f0 0%, #ede9df 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            padding: 30px;
        }
        
        .header {
            margin-bottom: 30px;
            border-bottom: 2px solid #e0ddd4;
            padding-bottom: 20px;
        }
        
        .header h1 {
            font-size: 20px;
            color: #2c2c2a;
            margin-bottom: 6px;
        }
        
        .header p {
            font-size: 13px;
            color: #888780;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #2c2c2a;
            margin-bottom: 8px;
        }
        
        select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d3d1c7;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
        }
        
        select:focus, textarea:focus {
            outline: none;
            border-color: #185fa5;
            box-shadow: 0 0 0 3px rgba(24, 95, 165, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .checkbox-item label {
            margin: 0;
            font-weight: 400;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .btn-save {
            background: #185fa5;
            color: white;
        }
        
        .btn-save:hover {
            background: #1348a3;
        }
        
        .btn-another {
            background: #e0ddd4;
            color: #2c2c2a;
        }
        
        .btn-another:hover {
            background: #d3d1c7;
        }
        
        .success {
            display: none;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #4caf50;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success" id="success">
            ✓ Saved to Tabbi! You can enter more or close.
        </div>
        
        <div class="header">
            <h1>📝 Quick Capture Entry</h1>
            <p>From workbook spread 9: Quick Capture Buckets</p>
        </div>
        
        <form id="captureForm">
            <div class="form-group">
                <label for="tab">Which tab does this belong to?</label>
                <select id="tab" name="tab" required>
                    <option value="">Choose one...</option>
                    <option value="work">Work</option>
                    <option value="finance">Finance</option>
                    <option value="home">Home</option>
                    <option value="health">Health</option>
                    <option value="goals">Goals</option>
                    <option value="custom">Other/Custom</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="notes">What did you write?</label>
                <textarea id="notes" name="notes" placeholder="Paste or type what you wrote on this page..." required></textarea>
            </div>
            
            <div class="form-group">
                <label>What is this?</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="isTask" name="type" value="task">
                        <label for="isTask">This is a task (needs doing)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="isReminder" name="type" value="reminder">
                        <label for="isReminder">This is a reminder (repeats)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="isNote" name="type" value="note">
                        <label for="isNote">Just a note (reference)</label>
                    </div>
                </div>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-save">Save & Close</button>
                <button type="button" class="btn-another" id="addAnother">Save & Add Another</button>
            </div>
        </form>
    </div>
    
    <script>
        const form = document.getElementById('captureForm');
        const successMsg = document.getElementById('success');
        const addAnotherBtn = document.getElementById('addAnother');
        
        function saveEntry(andClose = true) {
            const formData = {
                timestamp: new Date().toISOString(),
                spread: 'spread-09-quick-capture',
                tab: document.getElementById('tab').value,
                notes: document.getElementById('notes').value,
                types: Array.from(document.querySelectorAll('input[name="type"]:checked')).map(el => el.value)
            };
            
            // Store in localStorage
            let entries = JSON.parse(localStorage.getItem('tabbiEntries')) || [];
            entries.push(formData);
            localStorage.setItem('tabbiEntries', JSON.stringify(entries));
            
            // Show success
            successMsg.style.display = 'block';
            
            if (andClose) {
                setTimeout(() => {
                    window.close();
                }, 1500);
            } else {
                form.reset();
                document.getElementById('notes').focus();
                setTimeout(() => {
                    successMsg.style.display = 'none';
                }, 2000);
            }
        }
        
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            saveEntry(true);
        });
        
        addAnotherBtn.addEventListener('click', () => {
            saveEntry(false);
        });
    </script>
</body>
</html>
