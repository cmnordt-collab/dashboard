<svg width="100%" viewBox="0 0 680 480" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Hybrid Model: Physical + Digital + Voice</title>
<rect width="680" height="480" fill="#f5f5f0"/>
<text x="40" y="40" font-size="18" font-weight="500" fill="#2c2c2a">One System, Three Ways to Use It</text>
<rect x="40" y="70" width="180" height="200" fill="#f0eee3" stroke="#d3d1c7" stroke-width="0.5" rx="8"/>
<text x="130" y="95" font-size="32" font-weight="400" text-anchor="middle">📕</text>
<text x="130" y="120" font-size="13" font-weight="500" fill="#2c2c2a" text-anchor="middle">Physical Workbook</text>
<line x1="60" y1="130" x2="200" y2="130" stroke="#d3d1c7" stroke-width="0.5"/>
<text x="60" y="152" font-size="11" fill="#888780">• Your reference</text>
<text x="60" y="170" font-size="11" fill="#888780">• Backup if phone dies</text>
<text x="60" y="188" font-size="11" fill="#888780">• Write on bad days</text>
<text x="60" y="206" font-size="11" fill="#888780">• Sketch your system</text>
<text x="60" y="224" font-size="11" fill="#888780">• 40-page workbook</text>
<rect x="250" y="70" width="180" height="200" fill="#f0eee3" stroke="#d3d1c7" stroke-width="0.5" rx="8"/>
<text x="340" y="95" font-size="32" font-weight="400" text-anchor="middle">💻</text>
<text x="340" y="120" font-size="13" font-weight="500" fill="#2c2c2a" text-anchor="middle">Digital Dashboard</text>
<line x1="270" y1="130" x2="410" y2="130" stroke="#d3d1c7" stroke-width="0.5"/>
<text x="270" y="152" font-size="11" fill="#888780">• Fast & synced</text>
<text x="270" y="170" font-size="11" fill="#888780">• Reminders</text>
<text x="270" y="188" font-size="11" fill="#888780">• Capture by typing</text>
<text x="270" y="206" font-size="11" fill="#888780">• See your tabs</text>
<text x="270" y="224" font-size="11" fill="#888780">• Free HTML template</text>
<rect x="460" y="70" width="180" height="200" fill="#f0eee3" stroke="#d3d1c7" stroke-width="0.5" rx="8"/>
<text x="550" y="95" font-size="32" font-weight="400" text-anchor="middle">🎤</text>
<text x="550" y="120" font-size="13" font-weight="500" fill="#2c2c2a" text-anchor="middle">Voice Capture</text>
<line x1="480" y1="130" x2="620" y2="130" stroke="#d3d1c7" stroke-width="0.5"/>
<text x="480" y="152" font-size="11" fill="#888780">• Hands-free input</text>
<text x="480" y="170" font-size="11" fill="#888780">• While driving</text>
<text x="480" y="188" font-size="11" fill="#888780">• Siri integration</text>
<text x="480" y="206" font-size="11" fill="#888780">• Capture anywhere</text>
<text x="480" y="224" font-size="11" fill="#888780">• Goes to same system</text>
<line x1="220" y1="280" x2="250" y2="280" stroke="#d3d1c7" stroke-width="1.5"/>
<text x="235" y="275" font-size="10" fill="#888780" text-anchor="middle">all connected</text>
<line x1="430" y1="280" x2="460" y2="280" stroke="#d3d1c7" stroke-width="1.5"/>
<text x="445" y="275" font-size="10" fill="#888780" text-anchor="middle">all connected</text>
<rect x="40" y="310" width="600" height="80" fill="#d4e8e0" stroke="#5dcaa5" stroke-width="0.5" rx="8"/>
<text x="60" y="335" font-size="13" font-weight="500" fill="#0F6E56">One Design, Multiple Entry Points</text>
<text x="60" y="358" font-size="13" fill="#0F6E56">You design your system ONCE in the workbook. Then use it however fits that day or moment.</text>
<text x="60" y="378" font-size="13" fill="#0F6E56">You're not maintaining two systems. You're maintaining ONE with multiple ways to access it.</text>
<rect x="40" y="410" width="600" height="50" fill="#e6f1fb" stroke="#85b7eb" stroke-width="0.5" rx="8"/>
<text x="60" y="432" font-size="13" fill="#185fa5">The workbook + digital dashboard come as a pair. Design once, use everywhere.</text>
<text x="60" y="452" font-size="11" fill="#185fa5">Lose your phone? You still know what goes where. Can't type today? Voice or handwriting works.</text>
</svg>
