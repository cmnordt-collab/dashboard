<svg width="100%" viewBox="0 0 680 720" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Orbit Workbook Spread 1-2 Mockup</title>
<rect width="680" height="720" fill="#f5f5f0"/>
<defs>
<pattern id="dots" x="8" y="8" width="8" height="8" patternUnits="userSpaceOnUse">
<circle cx="4" cy="4" r="1" fill="#ccc" opacity="0.3"/>
</pattern>
</defs>
<g>
<rect x="20" y="20" width="310" height="680" fill="#faf9f6" stroke="#d3d1c7" stroke-width="0.5" rx="2"/>
<text x="40" y="55" font-size="20" font-weight="500" fill="#2c2c2a">Your Operating</text>
<text x="40" y="78" font-size="20" font-weight="500" fill="#2c2c2a">System</text>
<text x="40" y="115" font-size="12" fill="#888780" font-weight="400">Pages 1-2</text>
<line x1="40" y1="125" x2="310" y2="125" stroke="#d3d1c7" stroke-width="0.5"/>
<text x="40" y="155" font-size="14" font-weight="400" fill="#2c2c2a">A dashboard is where everything you care about lives.</text>
<text x="40" y="175" font-size="14" font-weight="400" fill="#2c2c2a">One place. Not five apps, not scattered notebooks.</text>
<text x="40" y="195" font-size="14" font-weight="400" fill="#2c2c2a">One system that works digital, on paper, or via voice.</text>
<text x="40" y="240" font-size="14" font-weight="500" fill="#2c2c2a">Why this works:</text>
<text x="40" y="265" font-size="13" font-weight="400" fill="#888780">• Overwhelm comes from scattered tools</text>
<text x="40" y="285" font-size="13" font-weight="400" fill="#888780">• One place = less cognitive load</text>
<text x="40" y="305" font-size="13" font-weight="400" fill="#888780">• Works offline, works when tech fails</text>
<text x="40" y="355" font-size="14" font-weight="500" fill="#2c2c2a">The 7 core pieces:</text>
<text x="40" y="375" font-size="13" font-weight="400" fill="#888780">Tabs, Quick Capture, Due Dates, Reminders, Status Badges, Time Context, Customization</text>
<rect x="40" y="410" width="270" height="80" fill="#e6f1fb" stroke="#b5d4f4" stroke-width="0.5" rx="4"/>
<text x="55" y="432" font-size="12" font-weight="500" fill="#185fa5">Design your own</text>
<text x="55" y="450" font-size="14" font-weight="400" fill="#185fa5">You're not following someone else's system. You're building one that works for YOUR brain, YOUR schedule, YOUR life.</text>
</g>
<g>
<rect x="350" y="20" width="310" height="680" fill="#faf9f6" stroke="#d3d1c7" stroke-width="0.5" rx="2"/>
<text x="370" y="55" font-size="14" font-weight="500" fill="#2c2c2a">Your Turn</text>
<line x1="370" y1="70" x2="640" y2="70" stroke="#d3d1c7" stroke-width="0.5"/>
<text x="370" y="100" font-size="12" font-weight="500" fill="#2c2c2a">Circle what applies to you:</text>
<circle cx="377" cy="127" r="4" fill="none" stroke="#b4b2a9" stroke-width="1"/>
<text x="390" y="131" font-size="13" fill="#2c2c2a">Time blindness</text>
<circle cx="377" cy="157" r="4" fill="none" stroke="#b4b2a9" stroke-width="1"/>
<text x="390" y="161" font-size="13" fill="#2c2c2a">Task paralysis</text>
<circle cx="377" cy="187" r="4" fill="none" stroke="#b4b2a9" stroke-width="1"/>
<text x="390" y="191" font-size="13" fill="#2c2c2a">Tool overwhelm</text>
<circle cx="377" cy="217" r="4" fill="none" stroke="#b4b2a9" stroke-width="1"/>
<text x="390" y="221" font-size="13" fill="#2c2c2a">Variable focus</text>
<line x1="370" y1="250" x2="640" y2="250" stroke="#d3d1c7" stroke-width="0.5" stroke-dasharray="2,2"/>
<text x="370" y="275" font-size="12" font-weight="500" fill="#2c2c2a">Sketch your ideal system:</text>
<rect x="370" y="285" width="260" height="120" fill="white" stroke="#d3d1c7" stroke-width="0.5" rx="2" opacity="0.5" stroke-dasharray="2,2"/>
<text x="385" y="345" font-size="11" fill="#b4b2a9" font-style="italic">What would make your life easier?</text>
<line x1="370" y1="420" x2="640" y2="420" stroke="#d3d1c7" stroke-width="0.5" stroke-dasharray="2,2"/>
<text x="370" y="445" font-size="12" font-weight="500" fill="#2c2c2a">Notes:</text>
<line x1="370" y1="455" x2="640" y2="455" stroke="#d3d1c7" stroke-width="0.5"/>
<line x1="370" y1="475" x2="640" y2="475" stroke="#d3d1c7" stroke-width="0.5"/>
<line x1="370" y1="495" x2="640" y2="495" stroke="#d3d1c7" stroke-width="0.5"/>
<line x1="370" y1="515" x2="640" y2="515" stroke="#d3d1c7" stroke-width="0.5"/>
<line x1="370" y1="535" x2="640" y2="535" stroke="#d3d1c7" stroke-width="0.5"/>
<rect x="370" y="555" width="260" height="130" fill="url(#dots)" stroke="#d3d1c7" stroke-width="0.5" rx="2"/>
<text x="385" y="615" font-size="11" fill="#b4b2a9" font-style="italic">Sketch space for your ideas</text>
</g>
</svg>
