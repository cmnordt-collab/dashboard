<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabbi Entry: Calendar Event</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            padding: 30px;
            border-top: 4px solid #4caf50;
        }
        
        .header {
            margin-bottom: 30px;
            border-bottom: 2px solid #e0ddd4;
            padding-bottom: 20px;
        }
        
        .header h1 {
            font-size: 20px;
            color: #2c2c2a;
            margin-bottom: 6px;
        }
        
        .header p {
            font-size: 13px;
            color: #888780;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #2c2c2a;
            margin-bottom: 8px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d3d1c7;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #4caf50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .btn-save {
            background: #4caf50;
            color: white;
        }
        
        .btn-save:hover {
            background: #388e3c;
        }
        
        .btn-another {
            background: #e0ddd4;
            color: #2c2c2a;
        }
        
        .btn-another:hover {
            background: #d3d1c7;
        }
        
        .success {
            display: none;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #4caf50;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success" id="success">
            ✓ Event added to Tabbi!
        </div>
        
        <div class="header">
            <h1>📅 Calendar Event</h1>
            <p>From workbook spread 11: Due Dates</p>
        </div>
        
        <form id="eventForm">
            <div class="form-group">
                <label for="title">Event title</label>
                <input type="text" id="title" name="title" placeholder="Meeting name, deadline, etc..." required>
            </div>
            
            <div class="row">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <div class="form-group">
                    <label for="time">Time (optional)</label>
                    <input type="time" id="time" name="time">
                </div>
            </div>
            
            <div class="form-group">
                <label for="recurring">Recurring?</label>
                <select id="recurring" name="recurring">
                    <option value="none">One time</option>
                    <option value="daily">Every day</option>
                    <option value="weekly">Every week</option>
                    <option value="monthly">Every month</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="notes">Notes (optional)</label>
                <textarea id="notes" name="notes" placeholder="Context, location, details..."></textarea>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-save">Save & Close</button>
                <button type="button" class="btn-another" id="addAnother">Save & Add Another</button>
            </div>
        </form>
    </div>
    
    <script>
        const form = document.getElementById('eventForm');
        const successMsg = document.getElementById('success');
        const addAnotherBtn = document.getElementById('addAnother');
        
        function saveEntry(andClose = true) {
            const formData = {
                timestamp: new Date().toISOString(),
                spread: 'spread-11-due-dates',
                title: document.getElementById('title').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value || null,
                recurring: document.getElementById('recurring').value,
                notes: document.getElementById('notes').value || null
            };
            
            let entries = JSON.parse(localStorage.getItem('tabbiEntries')) || [];
            entries.push(formData);
            localStorage.setItem('tabbiEntries', JSON.stringify(entries));
            
            successMsg.style.display = 'block';
            
            if (andClose) {
                setTimeout(() => window.close(), 1200);
            } else {
                form.reset();
                document.getElementById('title').focus();
                setTimeout(() => { successMsg.style.display = 'none'; }, 1500);
            }
        }
        
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            saveEntry(true);
        });
        
        addAnotherBtn.addEventListener('click', () => {
            saveEntry(false);
        });
    </script>
</body>
</html>
